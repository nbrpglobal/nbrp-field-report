<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>NBRP Field Report</title><link rel="icon" href="nbrplogo.svg"><style>
:root{--ink:#17202a;--muted:#68727d;--line:#dfe4e8;--soft:#f6f7f8;--brand:#111827;--danger:#b42318;--radius:14px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:18px 18px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{font-size:18px;color:#0b3a82}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:10px;font-weight:600}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{color:var(--danger)}.nav{display:flex;gap:12px;overflow:auto;padding:22px 0 10px}.nav a{white-space:nowrap;color:var(--muted);text-decoration:none;font-weight:700}.nav a.active{color:var(--ink)}h1{font-size:32px;line-height:1.15;margin:28px 0 8px}.sub{color:var(--muted);margin:0 0 26px}.section{padding:22px 0;border-top:1px solid var(--line)}.section h2{margin:0 0 8px;font-size:21px}.section p.help{margin:0 0 16px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:14px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;outline:none}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#7c8793;box-shadow:0 0 0 3px rgba(17,24,39,.07)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);position:relative;touch-action:none}.photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.photo .meta{padding:8px}.photo textarea{width:100%;border:0;border-top:1px solid var(--line);padding:8px;background:#fff;min-height:58px;resize:none}.photo .x{position:absolute;top:7px;right:7px;border:0;border-radius:50%;width:32px;height:32px;background:#fff;font-size:18px}.add-row{display:flex;justify-content:flex-end;margin-top:16px}.sig-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.sig{width:100%;height:240px;display:block;touch-action:none}.preview{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff}.preview .pv{display:grid;grid-template-columns:150px 1fr;gap:8px 18px}.preview .pv b{font-size:13px;color:var(--muted)}.preview-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.preview-photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.preview-actions{display:flex;justify-content:flex-end;margin-top:18px}.history-item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:10px}.muted{color:var(--muted)}.status{font-size:12px;font-weight:800;text-transform:uppercase}.empty{padding:30px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:20}.toast.show{display:block}@media(max-width:700px){.wrap{padding:14px 14px 38px}.grid{grid-template-columns:1fr}.photo-grid,.preview-photo-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}.preview .pv{grid-template-columns:1fr}.top-actions .btn{padding:9px 10px}.nav{padding-top:18px}.sig{height:210px}}
@media print{.no-print,.top,.nav,.footer,.preview-actions,.add-row{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.section{break-inside:avoid}.preview{border:0;padding:0}.photo-grid{display:grid}.photo{break-inside:avoid}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script src="config.js"></script><script src="api.js"></script><script>
const app=document.getElementById('app'),toast=document.getElementById('toast');let user=null,current=null,photos=[],sig=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function msg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
function field(k,label,val='',type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input id="f-${k}" type="${type}" value="${esc(val)}"></div>`}
function area(k,label,val='',full=true){return `<div class="field ${full?'full':''}"><label>${label}</label><textarea id="f-${k}">${esc(val)}</textarea></div>`}
async function boot(){try{const api=window.NBRPApi||window.NBRP_API;if(!api)throw new Error('API not loaded');const r=await api.me();user=r.user;renderApp()}catch{renderLogin()}}
function renderLogin(){app.innerHTML=`<main class="wrap"><div class="brand"><img src="nbrplogo.svg"><strong>NBRP Field Report</strong></div><div style="max-width:430px;margin:12vh auto"><h1>Login</h1><p class="sub">Sign in to your Field Report account</p><form id="login"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div><button class="btn primary" style="width:100%;margin-top:18px">Login</button></form><p class="muted" style="text-align:center;margin-top:18px">New customer? <a href="#register">Create Account</a></p></div></main>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const r=await NBRPApi.login({email:email.value,password:password.value});user=r.user;renderApp()}catch(e){msg(e.message)}}}
function renderRegister(){app.innerHTML=`<main class="wrap"><div class="brand"><img src="nbrplogo.svg"><strong>NBRP Field Report</strong></div><div style="max-width:500px;margin:8vh auto"><h1>Create Account</h1><p class="sub">Start your 14 day trial</p><form id="reg">${field('name','Name')}${field('company','Company')}${field('email','Email','','email')}${field('password','Password','','password')}</form><button class="btn primary" style="width:100%;margin-top:18px" id="create">Create Account</button><p class="muted" style="text-align:center;margin-top:18px"><a href="#login">Back to Login</a></p></div></main>`;create.onclick=async()=>{try{const r=await NBRPApi.register({name:document.getElementById('f-name').value,company:document.getElementById('f-company').value,email:document.getElementById('f-email').value,password:document.getElementById('f-password').value});user=r.user;renderApp()}catch(e){msg(e.message)}}}
function renderApp(){window.scrollTo(0,0);current=null;photos=[];app.innerHTML=`<main class="wrap"><header class="top"><div class="brand"><img src="nbrplogo.svg"><strong>Field Report</strong></div><div class="top-actions"><button class="btn" id="newReportBtn">New Report</button><button class="btn" id="historyBtn">History</button><button class="btn" id="logoutBtn">Logout</button></div></header><nav class="nav"><a class="active" href="#information">01 Information</a><a href="#photos">02 Photos</a><a href="#signature">03 Signature</a><a href="#preview">04 Report Preview</a></nav><h1>Field Report</h1><p class="sub">Create and review a professional field report</p><section class="section" id="information"><h2>01 Information</h2><p class="help">Enter the report and site information</p><div class="grid">${field('report_date','Date',new Date().toISOString().slice(0,10),'date')}${field('customer_name','Customer')}${field('site_name','Site')}${field('contact_name','Contact Name')}${field('contact_phone','Contact Phone','','tel')}${field('contact_email','Contact Email','','email')}${field('site_address','Site Address','', 'text',true)}${area('work_summary','Work Summary')}${area('findings','Findings')}${area('recommendations','Recommendations')}</div><div style="margin-top:16px"><button class="btn primary" id="saveBtn">Save Draft</button></div></section><section class="section" id="photos"><h2>02 Photos</h2><p class="help">Press and hold a photo, then drag to change the order</p><div id="photoGrid" class="photo-grid"></div><div class="add-row"><label class="btn primary">Add Photos<input id="photoFiles" type="file" accept="image/*" multiple hidden></label></div></section><section class="section" id="signature"><h2>03 Signature</h2><p class="help">Sign directly with your finger or pointer</p><div class="sig-wrap"><canvas id="sig" class="sig"></canvas></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="clearSigBtn">Clear Signature</button><button class="btn primary" id="saveSigBtn">Save Signature</button></div></section><section class="section" id="preview"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:14px"><div><h2>04 Report Preview</h2><p class="help">Check the report before generating the PDF</p></div></div><div id="previewBox" class="preview"></div><div class="preview-actions no-print"><button class="btn primary" id="pdfBtn">Generate / Print PDF</button></div></section><section class="section" id="history"><h2>Report History</h2><div style="display:flex;gap:8px"><input id="search" placeholder="Search reports" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:11px"><button class="btn" id="refreshBtn">Search</button></div><div id="historyList"></div></section><div class="footer">Field Report · Developed by <strong style="color:#0b3a82">NBRP GLOBAL</strong></div></main>`;bindApp();newReport()}
function getForm(){const v=k=>document.getElementById('f-'+k)?.value||'';return {report_date:v('report_date'),customer_name:v('customer_name'),site_name:v('site_name'),site_address:v('site_address'),contact_name:v('contact_name'),contact_phone:v('contact_phone'),contact_email:v('contact_email'),work_summary:v('work_summary'),findings:v('findings'),recommendations:v('recommendations')}}
function setForm(r){for(const [k,v] of Object.entries(r||{})){const el=document.getElementById('f-'+k);if(el)el.value=v??''}}
async function newReport(){current=null;photos=[];sig=null;setForm({report_date:new Date().toISOString().slice(0,10)});renderPhotos();renderPreview();initSig()}
async function ensureReport(){if(current)return current;const r=await NBRPApi.createReport(getForm());current=r.report;return current}
async function saveDraft(){try{const r=await ensureReport();const u=await NBRPApi.updateReport(r.id,getForm());current=u.report;msg('Draft saved');renderPreview()}catch(e){msg(e.message)}}
function renderPhotos(){const g=document.getElementById('photoGrid');if(!g)return;g.innerHTML=photos.length?photos.map((p,i)=>`<div class="photo" data-id="${p.id}"><button class="x no-print" data-del="${p.id}">×</button><img src="${p.url}" alt="Photo ${i+1}"><textarea data-note="${p.id}" placeholder="Photo note">${esc(p.note||'')}</textarea></div>`).join(''):`<div class="empty" style="grid-column:1/-1">No photos added</div>`;g.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{try{await NBRPApi.deletePhoto(current.id,b.dataset.del);photos=photos.filter(p=>p.id!==b.dataset.del);renderPhotos();renderPreview()}catch(e){msg(e.message)}});let drag=null,pressTimer=null;g.querySelectorAll('.photo').forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.target.closest('button,textarea'))return;pressTimer=setTimeout(()=>{drag=el;el.style.opacity='.55';el.setPointerCapture(e.pointerId)},450)});el.addEventListener('pointermove',e=>{if(!drag||drag!==el)return;const target=[...g.querySelectorAll('.photo')].find(x=>{const r=x.getBoundingClientRect();return x!==el&&e.clientY>=r.top&&e.clientY<=r.bottom});if(target){const r=target.getBoundingClientRect();target.parentNode.insertBefore(el,e.clientY<r.top+r.height/2?target:target.nextSibling)}});el.addEventListener('pointerup',()=>{clearTimeout(pressTimer);if(drag===el){el.style.opacity='';commitOrder()}});el.addEventListener('pointercancel',()=>{clearTimeout(pressTimer);el.style.opacity='';drag=null})});async function commitOrder(){const ids=[...g.querySelectorAll('.photo')].map(x=>x.dataset.id);photos.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));drag=null;if(current)try{await NBRPApi.reorderPhotos(current.id,ids)}catch(e){msg(e.message)}renderPreview()}g.querySelectorAll('[data-note]').forEach(t=>{t.onchange=async()=>{const p=photos.find(x=>x.id===t.dataset.note);if(p&&current){p.note=t.value;try{await NBRPApi.updatePhotoNote(current.id,p.id,p.note)}catch(e){msg(e.message)}}}})}
async function dataURLtoFile(url,name){const r=await fetch(url),b=await r.blob();return new File([b],name,{type:b.type})}
async function addFiles(list){try{await ensureReport();for(const file of list){const x=await NBRPApi.uploadPhoto(current.id,file,'',photos.length);photos.push({id:x.photo.id,url:x.photo.url,note:''})}renderPhotos();renderPreview();msg('Photos added')}catch(e){msg(e.message)}}
function renderPreview(){const b=document.getElementById('previewBox');if(!b)return;const r=getForm();b.innerHTML=`<div class="pv"><b>Report Number</b><span>${esc(current?.report_number||'Not created yet')}</span><b>Date</b><span>${esc(r.report_date)}</span><b>Customer</b><span>${esc(r.customer_name)}</span><b>Site</b><span>${esc(r.site_name)}</span><b>Site Address</b><span>${esc(r.site_address)}</span><b>Contact</b><span>${esc(r.contact_name)}</span><b>Contact Phone</b><span>${esc(r.contact_phone)}</span><b>Contact Email</b><span>${esc(r.contact_email)}</span><b>Work Summary</b><span>${esc(r.work_summary)}</span><b>Findings</b><span>${esc(r.findings)}</span><b>Recommendations</b><span>${esc(r.recommendations)}</span></div>${current?.signature_r2_key?`<div style="margin-top:18px"><b>Signature</b><div style="margin-top:8px"><img src="${current.signature_url}" style="max-width:320px;max-height:120px"></div></div>`:''}${photos.length?`<div class="preview-photo-grid">${photos.map(p=>`<div><img src="${p.url}">${p.note?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(p.note)}</div>`:''}</div>`).join('')}</div>`:''}`}
function initSig(){const c=document.getElementById('sig');if(!c)return;const d=devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=rect.width*d;c.height=rect.height*d;const x=c.getContext('2d');x.scale(d,d);x.lineWidth=2;x.lineCap='round';let down=false,last=null;const point=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{down=true;last=point(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;const p=point(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};c.onpointerup=c.onpointercancel=()=>{down=false;last=null}}
function bindApp(){logoutBtn.onclick=async()=>{await NBRPApi.logout();location.hash='#login';location.reload()};newReportBtn.onclick=newReport;saveBtn.onclick=saveDraft;photoFiles.onchange=e=>addFiles(e.target.files);clearSigBtn.onclick=()=>{const c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height)};saveSigBtn.onclick=async()=>{try{const r=await ensureReport();const c=document.getElementById('sig');const blob=await new Promise(res=>c.toBlob(res,'image/png'));await NBRPApi.uploadSignature(r.id,blob);msg('Signature saved')}catch(e){msg(e.message)}};pdfBtn.onclick=async()=>{await saveDraft();window.print()};historyBtn.onclick=async()=>{document.getElementById('history').scrollIntoView({behavior:'smooth'});await loadHistory()};refreshBtn.onclick=loadHistory;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')loadHistory()};loadHistory()}
async function loadHistory(){try{const r=await NBRPApi.listReports(document.getElementById('search')?.value||'');const el=document.getElementById('historyList');if(!el)return;el.innerHTML=r.reports.length?r.reports.map(x=>`<div class="history-item"><div><strong>${esc(x.report_number)}</strong><div class="muted">${esc(x.customer_name||'')} ${esc(x.site_name||'')}</div></div><div style="text-align:right"><div class="status">${esc(x.status)}</div><button class="btn" data-open="${x.id}">Edit</button> <button class="btn" data-dup="${x.id}">Duplicate</button> <button class="btn" data-del="${x.id}">Delete</button></div></div>`).join(''):`<div class="empty" style="margin-top:12px">No reports found</div>`;el.querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{try{await NBRPApi.duplicateReport(b.dataset.dup);await loadHistory();msg('Report duplicated')}catch(e){msg(e.message)}});el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this report?'))try{await NBRPApi.deleteReport(b.dataset.del);await loadHistory();msg('Report deleted')}catch(e){msg(e.message)}});el.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{const r=await NBRPApi.getReport(b.dataset.open);current=r.report;photos=(r.photos||[]).map(p=>({id:p.id,url:p.url,note:p.note||''}));setForm(current);renderPhotos();renderPreview();document.getElementById('information').scrollIntoView({behavior:'smooth'})})}catch(e){msg(e.message)}}
window.addEventListener('hashchange',()=>{if(location.hash==='#register')renderRegister();else if(location.hash==='#login')renderLogin()});boot();
</script></body></html>
