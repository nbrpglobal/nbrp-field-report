name = "nbrp-fieldreport"
main = "worker.js"
compatibility_date = "2026-10-08"

[[d1_databases]]
binding = "DB"
database_name = "nbrp-fieldreport"
database_id = "42fb2845-a2d4-4620-be76-5f35d2ffacce"

# Add this binding only after the R2 bucket exists
# [[r2_buckets]]
