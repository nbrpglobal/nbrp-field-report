[vars]
APP_ORIGIN = "https://REPLACE_WITH_YOUR_PAGES_DOMAIN"
SESSION_DAYS = "14"

# Set OWNER_EMAIL with `wrangler secret put OWNER_EMAIL`
# Set Stripe secrets only after Stripe products/prices are finalized
