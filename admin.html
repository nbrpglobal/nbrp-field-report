<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBRP Field Report Admin</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:20px;color:#17202a;background:#fff}.box{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{border:1px solid #dfe4e8;border-radius:12px;padding:16px}.muted{color:#68727d}.row{display:flex;justify-content:space-between;gap:12px;border:1px solid #dfe4e8;border-radius:10px;padding:12px;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}input{padding:10px;border:1px solid #dfe4e8;border-radius:9px;width:100%;box-sizing:border-box}</style></head><body><div class="box"><h1>Owner / Admin</h1><p id="state" class="muted">Loading</p><div id="stats" class="grid"></div><h2>Users</h2><input id="q" placeholder="Search users"><div id="users"></div></div><script src="config.js"></script><script src="api.js"></script><script>async function go(){try{const me=await NBRPApi.me();if(!['admin','owner'].includes(me.user.role)){state.textContent='Access denied';return}state.textContent='Signed in as '+me.user.email;const o=await NBRPApi.adminOverview();stats.innerHTML=[['Users',o.users],['Active Trials',o.activeTrials],['Reports',o.reports],['Drafts',o.drafts],['Completed',o.completed]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><strong style="font-size:26px">${x[1]}</strong></div>`).join('');async function load(){const r=await NBRPApi.adminUsers(q.value);users.innerHTML=r.users.length?r.users.map(x=>`<div class="row"><div><strong>${x.name}</strong><div class="muted">${x.email}</div></div><div style="text-align:right"><strong>${x.role}</strong><div class="muted">Trial ends ${x.trial_ends_at.slice(0,10)}</div></div></div>`).join(''):'<p class="muted">No users found</p>'}q.oninput=load;load()}catch(e){state.textContent=e.message}}go()</script></body></html>
